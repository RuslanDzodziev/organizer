<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0a08">
<title>Документы | Контур Движение</title>
<style>
html,body{margin:0;height:100%}
body{background:#0d0a08;color:#fff;font:400 15px/1.4 Montserrat,Rubik,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
.bg,.ph{position:fixed;inset:0;background-size:cover;background-position:center}
.bg{background-image:linear-gradient(165deg,#0a5b3d,#0b3d2b 55%,#4a1d0a);filter:brightness(.55)}
.ph{opacity:0;transition:opacity .8s ease;transform-origin:70% 30%;animation:kb 26s ease-in-out infinite alternate}
.ph.on{opacity:1}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12) translate(-1.5%,1.2%)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.sh{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.12) 45%,rgba(0,0,0,.72) 100%)}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end}
.c{box-sizing:border-box;width:100%;max-width:520px;margin:0 auto;padding:0 28px calc(96px + env(safe-area-inset-bottom))}
.logo{width:96px;height:96px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 34px rgba(0,0,0,.4)}
.logo img{width:86%;height:86%;object-fit:contain}
h1{margin:24px 0 0;font-weight:700;font-size:30px;line-height:1.15;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.s{margin-top:8px;color:rgba(255,255,255,.85)}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin-top:30px;overflow:hidden}
.fill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--l,#f3c58a),var(--d,#e07a2c));transition:width .3s ease}
.f{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;font-weight:500;color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums}
#lg65Text{display:none}
#lg65 p{margin:24px 0 0;color:#fff}
button{margin-top:14px;padding:10px 18px;border:0;border-radius:12px;background:#fff;color:#2b1a10;font:inherit;font-weight:600;cursor:pointer}
button:active{transform:scale(.96)}
@media (min-width:791px){
  .sh{background:linear-gradient(90deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 45%,rgba(0,0,0,0) 70%),linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.6) 100%)}
  .c{max-width:600px;margin:0;padding:0 0 72px 80px}
  .logo{width:128px;height:128px;border-radius:32px}
  h1{font-size:40px;margin-top:28px}
  .s{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.ph{animation:none}#fx{display:none}}
</style>
</head>

/* «Живое фото»: лёгкие сезонные частицы на canvas. R34FX(canvas,key) → stop() */
window.R34FX=function(cv,key){
  var X=cv.getContext('2d');if(!X)return function(){};
  var CFG={
    winter:{t:'snow',n:70},spring:{t:'petal',n:22,c:['#f8c9da','#ffe3ec','#ffffff']},summer:{t:'mote',n:26,c:['#ffe8a3','#d8f5b0']},
    autumn:{t:'leaf',n:16,c:['#d9481c','#f07b23','#e8a33a','#b8321a']},newyear:{t:'spark',n:46,c:['#ffd98a','#ffffff']},
    birthday:{t:'confetti',n:44,c:['#ff6fae','#ffd23f','#a66cff','#4fd1c5','#ffffff']},feb23:{t:'mote',n:18,c:['#ffd98a']},
    mar8:{t:'petal',n:22,c:['#ff9ec2','#ffd23f','#ffe3ec']},may1:{t:'petal',n:20,c:['#ffffff','#ffe3ec','#ffb3b3']},
    may9:{t:'ember',n:30,c:['#ffb347','#ff7a1a','#ffd98a']},russia:{t:'mote',n:22,c:['#ffffff','#e6ffd6']},unity:{t:'leaf',n:12,c:['#b8321a','#d9481c','#8a1f2a']}
  };
  var c=CFG[key]||CFG.autumn,W=0,H=0,D=Math.min(window.devicePixelRatio||1,2),P=[],raf=0,last=0,alive=true;
  function size(){W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;X.setTransform(D,0,0,D,0,0)}
  function r(a,b){return a+Math.random()*(b-a)}
  function pick(){return c.c?c.c[Math.floor(Math.random()*c.c.length)]:'#fff'}
  function mk(init){var p={x:r(0,W),y:init?r(-H*.1,H):r(-60,-10),a:r(0,6.28),va:r(-.02,.02),ph:r(0,6.28),col:pick()};
    switch(c.t){
      case 'snow':p.s=r(1,3.2);p.vy=r(.35,1.1);p.vx=r(-.2,.2);p.o=r(.45,.95);break;
      case 'leaf':p.s=r(9,17);p.vy=r(.55,1.25);p.vx=r(-.4,.15);p.va=r(-.03,.03);p.o=r(.75,1);break;
      case 'petal':p.s=r(4,8);p.vy=r(.35,.9);p.vx=r(-.35,.35);p.va=r(-.04,.04);p.o=r(.6,.95);break;
      case 'confetti':p.s=r(4,8);p.vy=r(.9,1.9);p.vx=r(-.5,.5);p.va=r(-.12,.12);p.o=1;break;
      case 'spark':p.s=r(.8,2.4);p.vy=r(.25,.7);p.vx=r(-.15,.15);p.o=r(.4,1);break;
      case 'ember':p.y=init?r(0,H):H+r(10,60);p.s=r(1,2.6);p.vy=-r(.35,1);p.vx=r(-.25,.25);p.o=r(.5,1);break;
      default:p.y=init?r(0,H):H+r(10,60);p.s=r(2,6);p.vy=-r(.12,.4);p.vx=r(-.15,.15);p.o=r(.15,.45);
    }return p}
  function leaf(p){X.save();X.translate(p.x,p.y);X.rotate(p.a);X.scale(1,.55+.45*Math.cos(p.ph));X.fillStyle=p.col;X.globalAlpha=p.o;
    var s=p.s;X.beginPath();X.moveTo(0,-s);X.bezierCurveTo(s*.9,-s*.6,s*.8,s*.3,0,s);X.bezierCurveTo(-s*.8,s*.3,-s*.9,-s*.6,0,-s);X.fill();
    X.strokeStyle='rgba(60,15,5,.35)';X.lineWidth=.8;X.beginPath();X.moveTo(0,-s*.8);X.lineTo(0,s*.95);X.stroke();X.restore()}
  function draw(p,t){
    X.globalAlpha=p.o;
    if(c.t==='leaf')return leaf(p);
    if(c.t==='petal'){X.save();X.translate(p.x,p.y);X.rotate(p.a);X.scale(1,.5+.5*Math.abs(Math.cos(p.ph)));X.fillStyle=p.col;X.beginPath();X.ellipse(0,0,p.s,p.s*.6,0,0,6.28);X.fill();X.restore();return}
    if(c.t==='confetti'){X.save();X.translate(p.x,p.y);X.rotate(p.a);X.scale(Math.cos(p.ph),1);X.fillStyle=p.col;X.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);X.restore();return}
    if(c.t==='spark'||c.t==='ember'){var tw=.55+.45*Math.sin(t*.004+p.ph);X.globalAlpha=p.o*tw;X.fillStyle=p.col;X.shadowColor=p.col;X.shadowBlur=8;X.beginPath();X.arc(p.x,p.y,p.s,0,6.28);X.fill();X.shadowBlur=0;return}
    if(c.t==='snow'){X.fillStyle='#fff';X.beginPath();X.arc(p.x,p.y,p.s,0,6.28);X.fill();return}
    var g=X.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s*2);g.addColorStop(0,p.col);g.addColorStop(1,'rgba(255,255,255,0)');X.fillStyle=g;X.beginPath();X.arc(p.x,p.y,p.s*2,0,6.28);X.fill();

    if(!cv.offsetParent&&cv.getClientRects().length===0)return;

  }
  size();var n=Math.round(c.n*Math.min(1.4,Math.max(.6,W*H/(390*844))));for(var i=0;i<n;i++)P.push(mk(true));
