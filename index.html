<style>
html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;background:#f5f8f5;color:#0a5b3d;font:500 14px/1.4 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:0 16px;box-sizing:border-box}
.box{width:min(320px,86vw);display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:132px;height:132px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(6,44,32,.18);margin-bottom:22px}
.logo img{width:86%;height:86%;object-fit:contain;display:block}
.title{font-weight:700;font-size:20px}
.ring{position:relative;width:118px;height:118px;margin:14px 0 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .bg{fill:none;stroke:rgba(10,91,61,.12);stroke-width:12}
.ring .fg{fill:none;stroke:url(#g);stroke-width:12;stroke-linecap:round;stroke-dasharray:314.16;stroke-dashoffset:314.16;transition:stroke-dashoffset .3s ease}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.track{display:none}
.row{color:#3d5a4a;margin-top:6px}
button{margin-top:14px;padding:10px 18px;border:0;border-radius:12px;background:#0a5b3d;color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:active{transform:scale(.96)}
@media (prefers-color-scheme:dark){body{background:#17201b;color:#e6efe9}.row{color:#a9bdb1}.ring .bg{stroke:rgba(255,255,255,.1)}.logo{box-shadow:0 14px 34px rgba(0,0,0,.45)}}
</style>
